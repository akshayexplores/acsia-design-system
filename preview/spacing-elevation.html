<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<style>
  body{ background:#f6f7f5; }
  .card{ background:#f6f7f5; }
  .item{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  .el{ width:96px; height:70px; background:#fff; border-radius:12px; }
  .cap{ font-family:var(--font-mono); font-size:11px; color:#5b6575; }
  .cap b{ color:#1e3659; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <div class="label" style="margin-bottom:14px">Elevation — cool-tinted shadows</div>
  <div class="row" style="justify-content:space-between;padding:4px 6px 10px">
    <div class="item"><div class="el" style="box-shadow:0 1px 2px rgba(20,36,60,0.06)"></div><div class="cap"><b>xs</b></div></div>
    <div class="item"><div class="el" style="box-shadow:0 1px 3px rgba(20,36,60,0.08),0 1px 2px rgba(20,36,60,0.06)"></div><div class="cap"><b>sm</b></div></div>
    <div class="item"><div class="el" style="box-shadow:0 6px 18px rgba(20,36,60,0.10),0 2px 6px rgba(20,36,60,0.06)"></div><div class="cap"><b>md</b></div></div>
    <div class="item"><div class="el" style="box-shadow:0 18px 48px rgba(20,36,60,0.16),0 6px 16px rgba(20,36,60,0.08)"></div><div class="cap"><b>lg</b></div></div>
    <div class="item"><div class="el" style="box-shadow:0 10px 30px rgba(54,171,255,0.35)"></div><div class="cap"><b>brand</b></div></div>
  </div>
</div>
</body>
</html>
