<!-- @dsCard group="Brand" name="Company at a glance" subtitle="Fact Sheet metrics — March 2026" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card" style="display:flex;flex-direction:column;gap:16px">
  <div class="label">Company at a glance · March 2026</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-soft);border:1px solid var(--border-soft);border-radius:var(--r-md);overflow:hidden">
    <div style="background:var(--bg);padding:18px 16px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-0.02em;color:var(--midnight-blue)">11<span style="font-size:16px;font-weight:600;color:var(--fg-muted);margin-left:3px">yrs</span></div>
      <div style="font-size:12.5px;color:var(--fg-muted);margin-top:6px">transforming mobility</div>
    </div>
    <div style="background:var(--bg);padding:18px 16px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-0.02em;color:var(--midnight-blue)">400<span style="color:var(--summer-sky)">+</span></div>
      <div style="font-size:12.5px;color:var(--fg-muted);margin-top:6px">engineers at work</div>
    </div>
    <div style="background:var(--bg);padding:18px 16px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-0.02em;color:var(--midnight-blue)">6<span style="font-size:16px;font-weight:600;color:var(--fg-muted);margin-left:3px">M</span></div>
      <div style="font-size:12.5px;color:var(--fg-muted);margin-top:6px">vehicles run on Acsia code</div>
    </div>
    <div style="background:var(--bg);padding:18px 16px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-0.02em;color:var(--midnight-blue)">40</div>
      <div style="font-size:12.5px;color:var(--fg-muted);margin-top:6px">live production programs</div>
    </div>
    <div style="background:var(--bg);padding:18px 16px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-0.02em;color:var(--midnight-blue)">20</div>
      <div style="font-size:12.5px;color:var(--fg-muted);margin-top:6px">OEM engagements</div>
    </div>
    <div style="background:var(--bg);padding:18px 16px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-0.02em;color:var(--midnight-blue)">15</div>
      <div style="font-size:12.5px;color:var(--fg-muted);margin-top:6px">Tier-1 engagements</div>
    </div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)">US · Germany · Japan · India — 8 offices worldwide</div>
</div>
</body>
</html>
