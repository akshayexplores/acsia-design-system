<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<style>
  .lock{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; border-radius:14px; padding:32px 18px; }
  .lock img{ height:44px; width:auto; display:block; }
  .ph{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="card">
  <div class="row" style="gap:14px">
    <div class="lock" style="background:#fff;border:1px solid #e9ebef">
      <img src="../assets/acsia-logo-black.jpg" alt="Acsia logo">
      <div class="ph" style="color:#8d99ae">primary · on light</div>
    </div>
    <div class="lock" style="background:#1e3659">
      <img src="../assets/acsia-logo-reversed.png" alt="Acsia logo reversed">
      <div class="ph" style="color:#6cc1ec">reversed · on Midnight Blue</div>
    </div>
  </div>
</div>
</body>
</html>
