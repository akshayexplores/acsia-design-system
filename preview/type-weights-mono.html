<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card">
  <div class="row" style="gap:32px;align-items:flex-start">
    <div class="col" style="gap:8px">
      <div class="label">Weights · IBM Plex Sans</div>
      <div style="font-size:21px;color:#1e3659">
        <div style="font-weight:300">Light 300 — Aa</div>
        <div style="font-weight:400">Regular 400 — Aa</div>
        <div style="font-weight:500">Medium 500 — Aa</div>
        <div style="font-weight:600">SemiBold 600 — Aa</div>
        <div style="font-weight:700">Bold 700 — Aa</div>
      </div>
    </div>
    <div class="col" style="gap:8px;flex:1">
      <div class="label">Eyebrow / Label</div>
      <div style="font-weight:600;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#36abff">Digital Cockpit &amp; Displays</div>
      <div class="label" style="margin-top:10px">IBM Plex Mono · data / code</div>
      <div style="font-family:var(--font-mono);font-size:13px;color:#3a4452;background:#f6f7f5;border:1px solid #e9ebef;border-radius:8px;padding:10px 12px;line-height:1.6">
        AUTOSAR · QNX · v14.2<br>charge: 82% &nbsp; range: 412 km
      </div>
    </div>
  </div>
</div>
</body>
</html>
