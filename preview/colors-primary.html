<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card">
  <div class="row">
    <div class="swatch" style="background:#36abff;color:#fff;flex:1.6">
      <div class="name">Summer Sky · primary accent</div>
      <div class="hex">#36ABFF</div>
    </div>
    <div class="swatch" style="background:#5eb3e4;color:#fff">
      <div class="name">Soft Blue</div>
      <div class="hex">#5EB3E4 · PMS 2915C</div>
    </div>
    <div class="swatch" style="background:#6cc1ec;color:#0d2740">
      <div class="name">Glacial Blue</div>
      <div class="hex">#6CC1EC</div>
    </div>
    <div class="swatch" style="background:#1e3659;color:#fff;flex:1.3">
      <div class="name">Midnight Blue · deep brand</div>
      <div class="hex">#1E3659</div>
    </div>
  </div>
</div>
</body>
</html>
