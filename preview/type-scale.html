<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<style>
  .line { display:flex; align-items:baseline; gap:14px; padding:5px 0; border-bottom:1px solid var(--border-soft); }
  .line .spec { font-family:var(--font-mono); font-size:10.5px; color:var(--fg-muted); margin-left:auto; white-space:nowrap; }
</style>
</head>
<body>
<div class="card">
  <div class="line"><span style="font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-0.02em;color:#1e3659">Heading One</span><span class="spec">H1 · 48 / 700</span></div>
  <div class="line"><span style="font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:-0.01em;color:#1e3659">Heading Two</span><span class="spec">H2 · 36 / 600</span></div>
  <div class="line"><span style="font-family:var(--font-display);font-weight:600;font-size:19px;color:#1e3659">Heading Three</span><span class="spec">H3 · 26 / 600</span></div>
  <div class="line"><span style="font-family:var(--font-sans);font-weight:400;font-size:16px;color:#3a4452">Body copy — confident, clear and honest. We simplify the complex.</span><span class="spec">Body · 16 / 400</span></div>
  <div class="line"><span style="font-family:var(--font-sans);font-weight:400;font-size:13px;color:#5b6575">Small / caption text for secondary information.</span><span class="spec">Small · 14 / 400</span></div>
</div>
</body>
</html>
