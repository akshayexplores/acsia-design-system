<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card">
  <div class="row">
    <div class="swatch" style="background:#ffffff;color:#1e3659">
      <div class="name">Crisp White</div>
      <div class="hex">#FFFFFF</div>
    </div>
    <div class="swatch" style="background:#edede9;color:#1e3659">
      <div class="name">Sea Salt</div>
      <div class="hex">#EDEDE9</div>
    </div>
    <div class="swatch" style="background:#dad7cd;color:#1e3659">
      <div class="name">Beach Sand</div>
      <div class="hex">#DAD7CD</div>
    </div>
    <div class="swatch" style="background:#8d99ae;color:#fff">
      <div class="name">Cool Grey</div>
      <div class="hex">#8D99AE</div>
    </div>
    <div class="swatch" style="background:#000000;color:#fff">
      <div class="name">Super Black</div>
      <div class="hex">#000000</div>
    </div>
  </div>
</div>
</body>
</html>
