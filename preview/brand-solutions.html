<!-- @dsCard group="Brand" name="Solutions & Accelerators" subtitle="Four Solutions + five in-house accelerators" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card" style="display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="label">Solutions</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
      <div style="border:1px solid var(--border-soft);border-top:3px solid var(--summer-sky);border-radius:var(--r-md);padding:12px 12px 14px">
        <div style="font-weight:600;font-size:13px;color:var(--midnight-blue)">Digital Cockpit &amp; Display</div>
        <div style="font-size:11.5px;color:var(--fg-muted);margin-top:4px;line-height:1.4">Clusters, HUD, IVI, RSE, Control Centres</div>
      </div>
      <div style="border:1px solid var(--border-soft);border-top:3px solid var(--summer-sky);border-radius:var(--r-md);padding:12px 12px 14px">
        <div style="font-weight:600;font-size:13px;color:var(--midnight-blue)">e-Mobility</div>
        <div style="font-size:11.5px;color:var(--fg-muted);margin-top:4px;line-height:1.4">AUTOSAR ECUs — power, BMS, on-board chargers</div>
      </div>
      <div style="border:1px solid var(--border-soft);border-top:3px solid var(--summer-sky);border-radius:var(--r-md);padding:12px 12px 14px">
        <div style="font-weight:600;font-size:13px;color:var(--midnight-blue)">Telematics</div>
        <div style="font-size:11.5px;color:var(--fg-muted);margin-top:4px;line-height:1.4">Telematics ECUs &amp; secure cloud apps</div>
      </div>
      <div style="border:1px solid var(--border-soft);border-top:3px solid var(--midnight-blue);border-radius:var(--r-md);padding:12px 12px 14px">
        <div style="font-weight:600;font-size:13px;color:var(--midnight-blue)">LiLA</div>
        <div style="font-size:11.5px;color:var(--fg-muted);margin-top:4px;line-height:1.4">Agentic AI Platform</div>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="label">Solution Accelerators</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <span style="font-family:var(--font-mono);font-size:11.5px;font-weight:500;letter-spacing:0.04em;color:var(--midnight-blue);background:var(--summer-sky-050);border:1px solid #cfe7fb;border-radius:var(--r-pill);padding:5px 12px">SABATON</span>
      <span style="font-family:var(--font-mono);font-size:11.5px;font-weight:500;letter-spacing:0.04em;color:var(--midnight-blue);background:var(--summer-sky-050);border:1px solid #cfe7fb;border-radius:var(--r-pill);padding:5px 12px">TITAN</span>
      <span style="font-family:var(--font-mono);font-size:11.5px;font-weight:500;letter-spacing:0.04em;color:var(--midnight-blue);background:var(--summer-sky-050);border:1px solid #cfe7fb;border-radius:var(--r-pill);padding:5px 12px">SHARP</span>
      <span style="font-family:var(--font-mono);font-size:11.5px;font-weight:500;letter-spacing:0.04em;color:var(--midnight-blue);background:var(--summer-sky-050);border:1px solid #cfe7fb;border-radius:var(--r-pill);padding:5px 12px">MAYAAVI</span>
      <span style="font-family:var(--font-mono);font-size:11.5px;font-weight:500;letter-spacing:0.04em;color:var(--midnight-blue);background:var(--summer-sky-050);border:1px solid #cfe7fb;border-radius:var(--r-pill);padding:5px 12px">XACT</span>
    </div>
  </div>
</div>
</body>
</html>
